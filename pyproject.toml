[project]
name = "akte-classifier"
version = "0.1.0"
description = "A repository for the MADS hackathon to build a text classifier for the kadaster dataset"
readme = "README.md"
authors = [
    { name = "raoul grouls", email = "Raoul.Grouls@han.nl" },
    { name = "Max Nollet", email = "mjh.nollet@student.han.nl" },
    { name = "Mischa Peters", email = "mb.peters2@student.han.nl" },
    { name = "Nick Reinders", email = "nr.reinders@student.han.nl" },
    { name = "Wouter van Huis", email = "wm.vanhuis@student.han.nl" },
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
    "transformers>=4.30.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "mlflow>=2.0.0",
    "typer>=0.20.0",
    "openai>=2.8.1",
    "ollama>=0.6.1",
    "pandas>=2.3.3",
    "polars>=1.35.2",
    "numpy>=2.3.5",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akte_classifier"]

[project.scripts]
kadaster = "akte_classifier.cli:app"

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "jupyter>=1.1.1",
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.2.250926",
    "ruff>=0.14.6",
    "types-seaborn>=0.13.2.20250914",
    "types-tqdm>=4.67.0.20250809",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
addopts = "-v --cov=src/akte_classifier --cov-report=term-missing"
testpaths = ["tests"]

[project.optional-dependencies]
cpu = ["torch>=2.9.1"]
xpu = ["pytorch-triton-xpu>=3.5.0", "torch>=2.9.1"]
cu128 = ["torch>=2.9.1"]
cu130 = ["torch>=2.9.1"]
rocm = ["pytorch-triton-rocm>=3.5.1", "torch>=2.9.1"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "xpu" },
        { extra = "cu128" },
        { extra = "cu130" },
        { extra = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-rocm", extra = "rocm" },
]
# Intel GPU support relies on `pytorch-triton-xpu`, which
# should also be installed from the PyTorch index (and 
# included in `project.dependencies`).
pytorch-triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]
# ROCm6 support relies on `pytorch-triton-rocm`, which
# should also be installed from the PyTorch index (and
# included in `project.dependencies`).
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true


[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "NPY", # NumPy-specific rules
    "PD",  # pandas-vet
    "N",   # pep8-naming
]
